  <style>

@media (max-width: 700px) {
  :root { --panel-w: 100vw; }
  .exp-panel { position: absolute; inset: 0 0 45% 0; width: 100%; height: 55%; }
  .resizer { display: none; }
  .graph-area { position: absolute; inset: 55% 0 0 0; }
  .topbar-title { display: none; }
  .kp-inner { padding: 0 8px 0 60px; }
  .keypad button[data-k] { min-width: 0; }
  .kp-main { gap: 8px; }
  .kp-right { display: none; }
}


.brand-logo { height: 22px; width: auto; max-width: 160px; object-fit: contain; }
.topbar-subtitle { font-size: 15.84px; font-weight: 300; }
.bp-backdrop { position: fixed; inset: 0; z-index: 100; background: rgba(0, 0, 0, 0.35); display: flex; align-items: center; justify-content: center; padding: 16px; }
.bp {
  width: 440px; max-width: 100%; max-height: calc(100vh - 32px); display: flex; flex-direction: column;
  background: #fff; border-radius: 6px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3); font: 300 15px Arial, sans-serif; color: #000;
}
.bp-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 8px; }
.bp-head h2 { margin: 0; font: 400 19px Arial, sans-serif; }
.bp-x { border: 0; background: none; font-size: 26px; line-height: 1; color: rgba(0, 0, 0, 0.5); padding: 0 4px; }
.bp-x:hover { color: #000; }
.bp-body { padding: 4px 18px 8px; overflow-y: auto; }
.bp-field { display: flex; flex-direction: column; gap: 5px; margin: 12px 0; }
.bp-label { font-size: 13px; color: rgba(0, 0, 0, 0.65); }
.bp-hint { font-size: 12px; color: rgba(0, 0, 0, 0.5); }
.bp input[type="text"] { border: 1px solid rgba(0, 0, 0, 0.2); border-radius: 3px; padding: 7px 8px; font: 300 15px Arial, sans-serif; outline: none; }
.bp input[type="text"]:focus { border-color: var(--blue); }
.bp-color { display: flex; gap: 8px; align-items: center; }
.bp-color input[type="color"] { width: 44px; height: 32px; padding: 0 2px; border: 1px solid rgba(0, 0, 0, 0.2); border-radius: 3px; background: #fff; cursor: pointer; }
.bp-color input[type="text"] { width: 100px; font-family: monospace; }
.bp-logo { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.bp-logo img { height: 34px; max-width: 120px; padding: 6px; border-radius: 4px; object-fit: contain; }
.bp-logo button, .bp-reset {
  border: 1px solid rgba(0, 0, 0, 0.2); background: #f7f7f7; border-radius: 3px; padding: 6px 10px; font: 300 13px Arial, sans-serif; color: #000;
}
.bp-logo button:hover, .bp-reset:hover { background: #eee; }
.bp-foot { display: flex; justify-content: space-between; padding: 10px 18px 16px; border-top: 1px solid rgba(0, 0, 0, 0.1); }
.bp-done { border: 0; background: var(--blue); color: #fff; border-radius: 3px; padding: 8px 18px; font: 400 14px Arial, sans-serif; }

.expand-btn [class^="i-"] { opacity: 0.6; }
.topbar { position: relative; }
.topbar-center-group {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  display: flex; align-items: center; gap: 8px; pointer-events: none; white-space: nowrap;
}
.topbar-center { width: auto; max-width: 200px; object-fit: contain; }

.topbar-center-text { font: 600 20px Arial, sans-serif; letter-spacing: -0.3px; }
.bp-inline { display: flex; align-items: center; gap: 12px; }
.bp-inline input[type="text"] { flex: 1; }
.bp-logo input[type="range"] { width: 90px; vertical-align: middle; }
.bp-logo button:disabled { opacity: 0.4; cursor: default; }

</style>

  <header class="topbar">
    <a class="brand" href="#" aria-label="Gridline">
      <img class="brand-logo" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+DQogIDxyZWN0IHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgcng9IjUiIGZpbGw9IiNmZmZmZmYiLz4NCiAgPHBhdGggZD0iTTQgMTguNSBDOCAxOC41IDkgNS41IDEyIDUuNSBTMTYgMTguNSAyMCAxOC41IiBmaWxsPSJub25lIiBzdHJva2U9IiMyZjZmOGYiIHN0cm9rZS13aWR0aD0iMi40IiBzdHJva2UtbGluZWNhcD0icm91bmQiLz4NCjwvc3ZnPg0K" alt="" height="22">
      <span class="wordmark">gridline</span>
    </a>
    <span class="topbar-sep"></span>
    <span class="topbar-title">Graphing Calculator</span>
    <span class="topbar-sep sub-sep hidden"></span>
    <span class="topbar-subtitle hidden"></span>
    <div class="topbar-center-group hidden">
      <img class="topbar-center hidden" alt="">
      <span class="topbar-center-text hidden"></span>
    </div>
  </header>

  <main class="app">
    <section class="exp-panel" id="exp-panel">
      <div class="exp-toolbar">
        <button class="tb-btn" id="btn-add" title="Add item" aria-label="Add item"><span class="i-plus"></span></button>
        <div class="popover add-menu" id="add-menu">
          <button data-add="expression"><span class="am-icon"><i>f</i>(<i>x</i>)</span> expression</button>
          <button data-add="note"><span class="am-icon">“</span> note</button>
          <button data-add="table"><span class="am-icon am-table"></span> table</button>
        </div>
        <div class="tb-mid">
          <button class="tb-btn" id="btn-undo" title="Undo (Ctrl+Z)" aria-label="Undo"><span class="i-undo"></span></button>
          <button class="tb-btn" id="btn-redo" title="Redo (Ctrl+Y)" aria-label="Redo"><span class="i-redo"></span></button>
        </div>
        <button class="tb-btn" id="btn-edit" title="Edit list" aria-label="Edit list"><span class="i-gear"></span></button>
        <button class="tb-btn" id="btn-collapse" title="Hide list" aria-label="Hide list"><span class="i-chev-l"></span></button>
        <div class="edit-bar">
          <button class="eb-delete" id="btn-delete-all">Delete All</button>
          <button class="eb-done" id="btn-edit-done">Done</button>
        </div>
      </div>
      <div class="exp-list" id="exp-list"></div>
      <div class="exp-footer">
        <button class="kp-toggle" id="btn-keypad" title="Show keypad" aria-label="Show keypad"><span class="i-keyboard"></span><span class="i-caret-up"></span></button>
        <span class="powered">powered by <b class="powered-name">gridline</b></span>
      </div>
    </section>
    <div class="resizer" id="resizer"></div>

    <section class="graph-area">
      <div id="graph" class="graph"></div>
      <button class="expand-btn" id="btn-expand" title="Show list" aria-label="Show list"><span class="i-chev-r"></span></button>
      <div class="graph-controls">
        <button class="gc-btn" id="btn-settings" title="Graph settings" aria-label="Graph settings"><span class="i-wrench"></span></button>
        <div class="gc-group">
          <button class="gc-btn" id="btn-zoom-in" title="Zoom in" aria-label="Zoom in"><span class="i-plus"></span></button>
          <button class="gc-btn" id="btn-zoom-out" title="Zoom out" aria-label="Zoom out"><span class="i-minus"></span></button>
        </div>
        <button class="gc-btn hidden" id="btn-home" title="Default viewport" aria-label="Default viewport"><span class="i-home"></span></button>
      </div>
      <div class="popover settings-pop" id="settings-pop">
        <div class="sp-row">
          <div class="seg">
            <button data-size="normal">A</button><button data-size="large" class="big">A</button>
          </div>
        </div>
        <label class="check"><input type="checkbox" data-s="reverseContrast"> Reverse contrast</label>
        <div class="sp-sep"></div>
        <div class="sp-grid">
          <div>
            <label class="check"><input type="checkbox" data-s="grid"> Grid</label>
            <label class="check"><input type="checkbox" data-s="arrows"> Arrows</label>
          </div>
          <div>
            <label class="check small"><input type="checkbox" data-s="axisNumbers"> Axis Numbers</label>
            <label class="check small"><input type="checkbox" data-s="minorGrid"> Minor Gridlines</label>
          </div>
        </div>
        <div class="sp-sep"></div>
        <div class="sp-row">
          <label class="check"><input type="checkbox" data-s="xAxis"> X-Axis</label>
          <input class="sp-label" data-label="xLabel" placeholder="Label, e.g. “x”">
        </div>
        <div class="sp-bounds">
          <input data-b="xmin"> <span>≤ <i>x</i> ≤</span> <input data-b="xmax">
        </div>
        <div class="sp-row">
          <label class="check"><input type="checkbox" data-s="yAxis"> Y-Axis</label>
          <input class="sp-label" data-label="yLabel" placeholder="Label, e.g. “y”">
        </div>
        <div class="sp-bounds">
          <input data-b="ymin"> <span>≤ <i>y</i> ≤</span> <input data-b="ymax">
        </div>
        <div class="sp-sep"></div>
        <div class="sp-row">
          <div class="seg">
            <button data-angle="rad">Radians</button><button data-angle="deg">Degrees</button>
          </div>
        </div>
        <div class="sp-row">
          <button class="sp-btn" id="btn-square">Zoom Square</button>
          <button class="sp-btn" id="btn-screenshot">Save Image</button>
        </div>
      </div>
    </section>
  </main>

  <div class="keypad" id="keypad">
    <div class="kp-inner">
      <div class="kp-main">
        <div class="kp-block kp-left">
          <button data-k="x"><i>x</i></button><button data-k="y"><i>y</i></button><button data-k="sq"><i>a</i><sup>2</sup></button><button data-k="pow"><i>a</i><sup><i>b</i></sup></button>
          <button data-k="(">(</button><button data-k=")">)</button><button data-k="&lt;">&lt;</button><button data-k="&gt;">&gt;</button>
          <button data-k="abs">|<i>a</i>|</button><button data-k=",">,</button><button data-k="le">≤</button><button data-k="ge">≥</button>
          <button data-k="abc" class="kp-dark">ABC</button><button data-k="frac" class="kp-frac kp-gray" title="Fraction"><span><i>a</i></span><span><i>b</i></span></button><button data-k="sqrt" class="kp-sqrt">√</button><button data-k="pi">π</button>
        </div>
        <div class="kp-block kp-nums">
          <button data-k="7" class="kp-num">7</button><button data-k="8" class="kp-num">8</button><button data-k="9" class="kp-num">9</button><button data-k="/">÷</button>
          <button data-k="4" class="kp-num">4</button><button data-k="5" class="kp-num">5</button><button data-k="6" class="kp-num">6</button><button data-k="times">×</button>
          <button data-k="1" class="kp-num">1</button><button data-k="2" class="kp-num">2</button><button data-k="3" class="kp-num">3</button><button data-k="-">−</button>
          <button data-k="0" class="kp-num">0</button><button data-k="." class="kp-num">.</button><button data-k="=">=</button><button data-k="+">+</button>
        </div>
        <div class="kp-block kp-right">
          <button data-k="funcs" class="kp-wide kp-gray">functions</button>
          <button data-k="left" class="kp-gray"><span class="i-arrow-l"></span></button><button data-k="right" class="kp-gray"><span class="i-arrow-r"></span></button>
          <button data-k="back" class="kp-wide kp-gray"><span class="i-back"></span></button>
          <button data-k="enter" class="kp-wide kp-enter"><span class="i-enter"></span></button>
        </div>
      </div>
      <div class="kp-abc abc-keys">
        <div class="abc-row"><button data-k="q">q</button><button data-k="w">w</button><button data-k="e">e</button><button data-k="r">r</button><button data-k="t">t</button><button data-k="y">y</button><button data-k="u">u</button><button data-k="i">i</button><button data-k="o">o</button><button data-k="p">p</button></div>
        <div class="abc-row"><button data-k="a">a</button><button data-k="s">s</button><button data-k="d">d</button><button data-k="f">f</button><button data-k="g">g</button><button data-k="h">h</button><button data-k="j">j</button><button data-k="k">k</button><button data-k="l">l</button><button data-k="theta">θ</button></div>
        <div class="abc-row"><button data-k="sub" class="kp-dark"><i>a</i><sub><i>b</i></sub></button><button data-k="z">z</button><button data-k="x">x</button><button data-k="c">c</button><button data-k="v">v</button><button data-k="b">b</button><button data-k="n">n</button><button data-k="m">m</button><button data-k="back" class="kp-dark"><span class="i-back"></span></button></div>
        <div class="abc-row"><button data-k="abc" class="kp-dark kp-wide">123</button><button data-k="sim">~</button><button data-k="!">!</button><button data-k="[">[</button><button data-k="]">]</button><button data-k="{">{</button><button data-k=":">:</button><button data-k="enter" class="kp-enter kp-wide"><span class="i-enter"></span></button></div>
      </div>
      <button class="kp-close" id="btn-keypad-close" title="Hide keypad" aria-label="Hide keypad"><span class="i-keyboard"></span><span class="i-caret-down"></span></button>
      <div class="popover func-pop" id="func-pop">
        <div class="fp-h">TRIG FUNCTIONS</div>
        <div class="fp-grid">
          <button data-k="fn:sin">sin</button><button data-k="fn:cos">cos</button><button data-k="fn:tan">tan</button>
          <button data-k="fn:csc">csc</button><button data-k="fn:sec">sec</button><button data-k="fn:cot">cot</button>
        </div>
        <div class="fp-h">INVERSE TRIG FUNCTIONS</div>
        <div class="fp-grid">
          <button data-k="fn:arcsin">sin<sup>−1</sup></button><button data-k="fn:arccos">cos<sup>−1</sup></button><button data-k="fn:arctan">tan<sup>−1</sup></button>
          <button data-k="fn:arccsc">csc<sup>−1</sup></button><button data-k="fn:arcsec">sec<sup>−1</sup></button><button data-k="fn:arccot">cot<sup>−1</sup></button>
        </div>
        <div class="fp-h">STATISTICS</div>
        <div class="fp-grid">
          <button data-k="fn:mean">mean</button><button data-k="fn:median">median</button><button data-k="fn:min">min</button>
          <button data-k="fn:max">max</button><button data-k="fn:stdev">stdev</button><button data-k="fn:total">total</button>
          <button data-k="fn:length">length</button><button data-k="fn:var">var</button><button data-k="sim">~</button>
        </div>
        <div class="fp-h">NUMBER THEORY</div>
        <div class="fp-grid">
          <button data-k="abs">|<i>a</i>|</button><button data-k="fn:round">round</button><button data-k="fn:floor">floor</button>
          <button data-k="fn:ceil">ceil</button><button data-k="fn:mod">mod</button><button data-k="fact">!</button>
          <button data-k="fn:gcd">gcd</button><button data-k="fn:lcm">lcm</button><button data-k="nthroot"><sup>n</sup>√</button>
          <button data-k="fn:nCr">nCr</button><button data-k="fn:nPr">nPr</button><button data-k="fn:sign">sign</button>
        </div>
        <div class="fp-h">LOGARITHMS</div>
        <div class="fp-grid">
          <button data-k="fn:ln">ln</button><button data-k="fn:log">log</button><button data-k="logb">log<sub>a</sub></button>
          <button data-k="ex"><i>e</i><sup>x</sup></button><button data-k="tenx">10<sup>x</sup></button><button data-k="fn:exp">exp</button>
        </div>
      </div>
    </div>
  </div>

    visibleGraphs() { return this.graphs.filter(g => !g.hidden); }

    hitDraggable(p) {

    traceAt(g, p) {

    hitCurve(p) {

    computePOIs() {
      this.pois = [];
      if (this.selectedId == null) return;
      const sel = this.visibleGraphs().filter(g => g.id === this.selectedId && g.kind === 'fx' && !g.ineq);
      if (!sel.length) return;
      const b = this.bounds;
      const N = 500;
      const others = this.visibleGraphs().filter(g => g.kind === 'fx' && !g.ineq && !sel.includes(g));
      const add = (x, y, g) => {
        if (!Number.isFinite(x) || !Number.isFinite(y)) return;
        if (x < b.xmin || x > b.xmax || y < b.ymin || y > b.ymax) return;

        if (b.xmin <= 0 && b.xmax >= 0) add(0, g.f(0), g);

            }

        }

        for (const o of others) {
          const d = x => g.f(x) - o.f(x);

            const cur = d(xs[i]);

    draw() {
      const ctx = this.ctx, dpr = this.dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, this.w, this.h);

      const vis = this.visibleGraphs();

      for (const g of vis) this.safe(() => this.drawFill(g));
      for (const g of vis) this.safe(() => this.drawCurve(g));
      for (const g of vis) if (g.kind === 'points') this.safe(() => this.drawPoints(g));

      for (const q of this.pois) {
        if (this.label && this.label.x === q.x && this.label.y === q.y) continue;
        this.dot(q.x, q.y, '#999', 4.5, true);
      }
      if (this.trace) {
        this.dot(this.trace.x, this.trace.y, this.trace.g.color, 4.5);
        this.drawLabel(this.trace.x, this.trace.y);
      } else if (this.label) {
        this.dot(this.label.x, this.label.y, this.label.color, 4.5);
        this.drawLabel(this.label.x, this.label.y);
      }
    }
    safe(fn) { try { fn(); } catch (e) {  } }

    drawGrid() {
      const ctx = this.ctx, s = this.settings;

          for (let k = Math.ceil(b.ymin / my); k * my <= b.ymax; k++) { const py = Math.round(this.Y(k * my)) + 0.5; ctx.moveTo(0, py); ctx.lineTo(this.w, py); }
          ctx.stroke();
        }
        ctx.strokeStyle = 'rgba(0,0,0,0.22)';
        ctx.beginPath();
        for (let k = Math.ceil(b.xmin / gx.step); k * gx.step <= b.xmax; k++) { const px = Math.round(this.X(k * gx.step)) + 0.5; ctx.moveTo(px, 0); ctx.lineTo(px, this.h); }
        for (let k = Math.ceil(b.ymin / gy.step); k * gy.step <= b.ymax; k++) { const py = Math.round(this.Y(k * gy.step)) + 0.5; ctx.moveTo(0, py); ctx.lineTo(this.w, py); }

      }

      ctx.strokeStyle = 'rgba(0,0,0,0.9)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      if (s.xAxis && y0 >= 0 && y0 <= this.h) { ctx.moveTo(0, Math.round(y0) + 0.5); ctx.lineTo(this.w, Math.round(y0) + 0.5); }
      if (s.yAxis && x0 >= 0 && x0 <= this.w) { ctx.moveTo(Math.round(x0) + 0.5, 0); ctx.lineTo(Math.round(x0) + 0.5, this.h); }
      ctx.stroke();
      if (s.arrows) {
        ctx.fillStyle = 'rgba(0,0,0,0.9)';

        if (s.yAxis && x0 >= 0 && x0 <= this.w) { this.arrow(x0 + 0.5, 1, 0, -1); this.arrow(x0 + 0.5, this.h - 1, 0, 1); }

      if (s.yLabel && s.yAxis) { ctx.textAlign = 'left'; ctx.textBaseline = 'top'; const x = Math.min(Math.max(x0 + 8, 4), this.w - 40); ctx.strokeText(s.yLabel, x, 8); ctx.fillText(s.yLabel, x, 8); }
    }
    arrow(x, y, dx, dy) {
      const ctx = this.ctx, L = 10, W = 5;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x - dx * L - dy * W, y - dy * L - dx * W);
      ctx.lineTo(x - dx * L + dy * W, y - dy * L + dx * W);

    setStroke(g, strict) {
      const ctx = this.ctx;
      ctx.strokeStyle = g.color;
      ctx.lineWidth = (g.width || 2.5) + (g.id === this.selectedId && this.selectedId != null ? 0.5 : 0);
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';

    samplePolylines(f, a, b, toP, span, vScale) {

      let cur = null;
      const N = Math.ceil(span / 2);

      const brk = () => { cur = null; };

        let lo = u0, hi = u1;
        for (let k = 0; k < 30; k++) {
          const m = (lo + hi) / 2;
          const v = f(m);
          if (Number.isFinite(v) === okAt0) lo = m; else hi = m;

        seg(u0, v0, um, vm, d + 1);

    curveLines(g) {

        let prev = null;
        for (let i = 0; i <= N; i++) {

          const q = this.paramPoint(g, t);
          if (!q) { cur = null; prev = null; continue; }
          const p = [cl(this.X(q.x)), cl(this.Y(q.y))];
          if (prev && Math.hypot(p[0] - prev[0], p[1] - prev[1]) > Math.max(this.w, this.h)) cur = null;

    drawFill(g) {

    drawCurve(g) {

      this.setStroke(g, g.ineq === '<' || g.ineq === '>');

    marching(f, cond) {

      ctx.beginPath();
      const all = [];
      const lerp = (a, b) => a / (a - b);
      for (let j = 0; j < ny - 1; j++) {

          if (!(Number.isFinite(a) && Number.isFinite(b) && Number.isFinite(c) && Number.isFinite(d))) continue;

          const x0 = i * R, y0 = j * R;

          const segs = [];
          switch (idx) {

            case 2: case 13: segs.push([bottom, right]); break;
            case 3: case 12: segs.push([left, right]); break;
            case 4: case 11: segs.push([top, right]); break;
            case 6: case 9: segs.push([top, bottom]); break;
            case 7: case 8: segs.push([left, top]); break;
            case 5: segs.push(fc > 0 ? [left, top] : [left, bottom], fc > 0 ? [bottom, right] : [top, right]); break;

          }

    powered: 'gridline'
  };
  const DEFAULT_LOGO = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+DQogIDxyZWN0IHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgcng9IjUiIGZpbGw9IiNmZmZmZmYiLz4NCiAgPHBhdGggZD0iTTQgMTguNSBDOCAxOC41IDkgNS41IDEyIDUuNSBTMTYgMTguNSAyMCAxOC41IiBmaWxsPSJub25lIiBzdHJva2U9IiMyZjZmOGYiIHN0cm9rZS13aWR0aD0iMi40IiBzdHJva2UtbGluZWNhcD0icm91bmQiLz4NCjwvc3ZnPg0K';
  const MAX_LOGO_BYTES = 1024 * 1024;
  const HEX = /^#[0-9a-f]{6}$/i;
  const IMAGE_URL = /^data:image\/(png|jpe?g|gif|webp|svg\+xml);base64,/;

  let brand = load();

  function load() {
    try {
      const saved = JSON.parse(localStorage.getItem(KEY));
      if (saved && typeof saved === 'object') return sanitize(Object.assign({}, DEFAULTS, saved));
    } catch (e) {  }
    return Object.assign({}, DEFAULTS);
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(brand)); }
    catch (e) { alert('Could not save the branding. The logo may be too large for browser storage.'); }
  }
  function sanitize(b) {
    if (!HEX.test(b.barColor)) b.barColor = DEFAULTS.barColor;
    if (!HEX.test(b.textColor)) b.textColor = DEFAULTS.textColor;
    for (const k of ['logo', 'centerIcon']) {
      if (typeof b[k] !== 'string' || (b[k] && !IMAGE_URL.test(b[k]))) b[k] = '';
    }
    b.nameBold = b.nameBold !== false;
    b.centerSize = Math.min(44, Math.max(16, Number(b.centerSize) || DEFAULTS.centerSize));
    for (const k of ['name', 'title', 'subtitle', 'powered', 'centerText']) b[k] = String(b[k] == null ? '' : b[k]).slice(0, 80);
    b.showLogo = b.showLogo !== false;
    return b;
  }


  const $ = s => document.querySelector(s);
  function apply() {
    const bar = $('.topbar');
    bar.style.background = brand.barColor;
    bar.style.color = brand.textColor;
    $('.brand').style.color = brand.textColor;
    $('.brand').setAttribute('aria-label', brand.name || 'Home');
    const logo = $('.brand-logo');
    logo.src = brand.logo || DEFAULT_LOGO;
    logo.classList.toggle('hidden', !brand.showLogo);
    $('.wordmark').textContent = brand.name;
    $('.wordmark').style.fontWeight = brand.nameBold ? '600' : '300';
    const center = $('.topbar-center');
    if (brand.centerIcon) center.src = brand.centerIcon; else center.removeAttribute('src');
    center.style.height = brand.centerSize + 'px';
    center.classList.toggle('hidden', !brand.centerIcon);
    const cText = $('.topbar-center-text');
    cText.textContent = brand.centerText;
    cText.classList.toggle('hidden', !brand.centerText);
    $('.topbar-center-group').classList.toggle('hidden', !brand.centerIcon && !brand.centerText);
    $('.wordmark').classList.toggle('hidden', !brand.name);
    $('.topbar-title').textContent = brand.title;
    $('.topbar-title').classList.toggle('hidden', !brand.title);
    $('.topbar-sep:not(.sub-sep)').classList.toggle('hidden', !brand.title || (!brand.name && !brand.showLogo));
    $('.topbar-subtitle').textContent = brand.subtitle;
    $('.topbar-subtitle').classList.toggle('hidden', !brand.subtitle);
    $('.sub-sep').classList.toggle('hidden', !brand.subtitle);
    document.querySelectorAll('.topbar-sep').forEach(s => { s.style.background = brand.textColor; s.style.opacity = '0.45'; });
    $('.powered-name').textContent = brand.powered;
    $('.powered').classList.toggle('hidden', !brand.powered);
    document.title = [brand.name, brand.title].filter(Boolean).join(' ') || 'Graphing Calculator';
    const icon = document.querySelector('link[rel="icon"]');
    if (icon) icon.href = brand.logo || DEFAULT_LOGO;
  }


  let panel = null;

  function readImage(input, done) {
    const f = input.files[0];
    input.value = '';
    if (!f) return;
    if (f.size > MAX_LOGO_BYTES) { alert('Please choose an image under 1 MB.'); return; }
    if (!/^image\/(png|jpeg|gif|webp|svg\+xml)$/.test(f.type)) { alert('Please choose a PNG, JPEG, GIF, WebP or SVG image.'); return; }
    const reader = new FileReader();
    reader.onload = () => done(String(reader.result));
    reader.readAsDataURL(f);
  }
  function field(label, input, hint) {
    const row = document.createElement('label');
    row.className = 'bp-field';
    const span = document.createElement('span');
    span.className = 'bp-label';
    span.textContent = label;
    row.append(span, input);
    if (hint) { const h = document.createElement('span'); h.className = 'bp-hint'; h.textContent = hint; row.append(h); }
    return row;
  }
  function textInput(key, placeholder) {
    const inp = document.createElement('input');
    inp.type = 'text'; inp.maxLength = 80; inp.value = brand[key]; inp.placeholder = placeholder || '';
    inp.addEventListener('input', () => { brand[key] = inp.value; apply(); save(); });
    return inp;
  }
  function colorInput(key) {
    const wrap = document.createElement('span');
    wrap.className = 'bp-color';
    const pick = document.createElement('input');
    pick.type = 'color'; pick.value = brand[key];
    const hex = document.createElement('input');
    hex.type = 'text'; hex.value = brand[key]; hex.maxLength = 7; hex.spellcheck = false;
    pick.addEventListener('input', () => { brand[key] = pick.value; hex.value = pick.value; apply(); save(); });
    hex.addEventListener('input', () => {
      const v = hex.value.startsWith('#') ? hex.value : '#' + hex.value;
      if (HEX.test(v)) { brand[key] = v.toLowerCase(); pick.value = brand[key]; apply(); save(); }
    });
    wrap.append(pick, hex);
    return wrap;
  }

  function open() {
    if (panel) { close(); return; }
    panel = document.createElement('div');
    panel.className = 'bp-backdrop';
    panel.innerHTML = '<div class="bp" role="dialog" aria-modal="true" aria-labelledby="bp-h"><div class="bp-head"><h2 id="bp-h">Appearance</h2><button class="bp-x" aria-label="Close">×</button></div><div class="bp-body"></div><div class="bp-foot"><button class="bp-reset">Reset to defaults</button><button class="bp-done">Done</button></div></div>';
    const body = panel.querySelector('.bp-body');


    const logoBox = document.createElement('div');
    logoBox.className = 'bp-logo';
    const prev = document.createElement('img');
    prev.alt = '';
    const file = document.createElement('input');
    file.type = 'file'; file.accept = 'image/png,image/jpeg,image/gif,image/webp,image/svg+xml';
    file.className = 'hidden';
    const upload = document.createElement('button'); upload.textContent = 'Upload image…';
    const def = document.createElement('button'); def.textContent = 'Use default';
    const show = document.createElement('label'); show.className = 'check';
    const showCb = document.createElement('input'); showCb.type = 'checkbox'; showCb.checked = brand.showLogo;
    show.append(showCb, ' Show logo');
    const syncPrev = () => { prev.src = brand.logo || DEFAULT_LOGO; prev.style.background = brand.barColor; };
    syncPrev();
    upload.addEventListener('click', () => file.click());
    file.addEventListener('change', () => readImage(file, url => {
      brand.logo = url; sanitize(brand); brand.showLogo = true; showCb.checked = true; apply(); save(); syncPrev();
    }));
    def.addEventListener('click', () => { brand.logo = ''; apply(); save(); syncPrev(); });
    showCb.addEventListener('change', () => { brand.showLogo = showCb.checked; apply(); save(); });
    logoBox.append(prev, upload, def, file, show);


    const nameBox = document.createElement('div');
    nameBox.className = 'bp-inline';
    const boldLbl = document.createElement('label'); boldLbl.className = 'check';
    const boldCb = document.createElement('input'); boldCb.type = 'checkbox'; boldCb.checked = brand.nameBold;
    boldLbl.append(boldCb, ' Bold');
    boldCb.addEventListener('change', () => { brand.nameBold = boldCb.checked; apply(); save(); });
    nameBox.append(textInput('name', 'Shown next to the logo'), boldLbl);


    const cBox = document.createElement('div');
    cBox.className = 'bp-logo';
    const cPrev = document.createElement('img'); cPrev.alt = '';
    const cFile = document.createElement('input');
    cFile.type = 'file'; cFile.accept = file.accept; cFile.className = 'hidden';
    const cUpload = document.createElement('button'); cUpload.textContent = 'Upload image…';
    const cRemove = document.createElement('button'); cRemove.textContent = 'Remove';
    const cSizeLbl = document.createElement('label'); cSizeLbl.className = 'check';
    const cSize = document.createElement('input');
    cSize.type = 'range'; cSize.min = 16; cSize.max = 44; cSize.step = 1; cSize.value = brand.centerSize;
    cSizeLbl.append('Size ', cSize);
    const syncCenter = () => {
      cPrev.classList.toggle('hidden', !brand.centerIcon);
      if (brand.centerIcon) cPrev.src = brand.centerIcon;
      cPrev.style.background = brand.barColor;
      cRemove.disabled = !brand.centerIcon;
      cSizeLbl.classList.toggle('hidden', !brand.centerIcon);
    };
    syncCenter();
    cUpload.addEventListener('click', () => cFile.click());
    cFile.addEventListener('change', () => readImage(cFile, url => { brand.centerIcon = url; sanitize(brand); apply(); save(); syncCenter(); }));
    cRemove.addEventListener('click', () => { brand.centerIcon = ''; apply(); save(); syncCenter(); });
    cSize.addEventListener('input', () => { brand.centerSize = Number(cSize.value); apply(); save(); });
    cBox.append(cPrev, cUpload, cRemove, cFile, cSizeLbl);

    const barColor = colorInput('barColor');
    barColor.querySelectorAll('input').forEach(i => i.addEventListener('input', () => { syncPrev(); syncCenter(); }));
    body.append(
      field('Top bar colour', barColor),
      field('Top bar text colour', colorInput('textColor')),
      field('Logo', logoBox),
      field('Name', nameBox),
      field('Centre icon', cBox, 'Shown in the middle of the top bar. Separate from the logo at the top left.'),
      field('Centre text', textInput('centerText', 'Optional'), 'Shown to the right of the centre icon, in the same style as the "powered by" name. The icon and text are centred together.'),
      field('Header text', textInput('title', 'e.g. Graphing Calculator')),
      field('Second header text', textInput('subtitle', 'Optional'), 'Shown after another divider. Leave blank to hide it.'),
      field('Powered by', textInput('powered', 'Name under "powered by"'), 'Leave blank to hide the "powered by" line.')
    );

    panel.querySelector('.bp-x').addEventListener('click', close);
    panel.querySelector('.bp-done').addEventListener('click', close);
    panel.querySelector('.bp-reset').addEventListener('click', () => {
      if (!confirm('Reset the top bar, logo and text to the defaults?')) return;
      brand = Object.assign({}, DEFAULTS); apply(); save(); close(); open();
    });
    panel.addEventListener('mousedown', e => { if (e.target === panel) close(); });
    panel.addEventListener('keydown', e => { if (e.key === 'Escape') { e.stopPropagation(); close(); } });
    document.body.appendChild(panel);
    panel.querySelector('.bp-body input[type="text"]').focus();
  }
  function close() {
    if (!panel) return;
    panel.remove();
    panel = null;
  }


  window.addEventListener('keydown', e => {
    if (e.code === 'Backquote' && e.shiftKey && (e.ctrlKey || e.metaKey) && !e.altKey) {
      e.preventDefault();
      e.stopPropagation();
      open();
    }
  }, true);

  apply();
  window.__branding = { open, close, get: () => Object.assign({}, brand) };
})();

</script>
</body>
</html>
